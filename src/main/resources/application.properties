server.port=8082
spring.application.name=job-search-ai
server.servlet.context-path=/ai
server.forward-headers-strategy=framework

# OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWKS_URI}
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256

# Google Gemini via Spring AI
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL}

# Job Search API base URL (via gateway)
job-search.api.base-url=${JOB_SEARCH_API_URL}

# SpringDoc — restrict scanning to our controllers only (Spring AI registers its own REST beans that break SpringDoc)
springdoc.packages-to-scan=com.jobsearch.ai.controller

# Logging
logging.level.com.jobsearch.ai=INFO
